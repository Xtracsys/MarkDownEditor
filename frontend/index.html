<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" />
    <title>Xtracsys Editor</title>
  </head>
  <body>
    <div id="app">
      <div id="tabbar">
        <button id="btn-new" class="iconbtn" title="New Tab (⌘/Ctrl+N)">＋</button>
        <button id="btn-open" class="iconbtn" title="Open… (⌘/Ctrl+O)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M2.5 13.5v-9l3-2.5h3v11.5z" /><path d="M8.5 4.5h5v9h-5" />
          </svg>
        </button>
        <button id="btn-save" class="iconbtn" title="Save (⌘/Ctrl+S)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M3 2.5h8l2 2v9h-10z" /><path d="M5 2.5v3.5h5v-3.5" /><path d="M5 13.5v-4h6v4" />
          </svg>
        </button>
        <span style="width:8px"></span>
        <span id="tabbar-controls" style="display:flex;align-items:center;gap:2px">
          <div id="tabbar-spacer"></div>
          <div id="toolbar-right">
            <div class="seg" role="group" aria-label="View mode">
              <button id="btn-mode-source" title="Source (Alt+1)">Source</button>
              <button id="btn-mode-split" title="Split (Alt+2)">Split</button>
              <button id="btn-mode-preview" title="Preview (Alt+3)">Preview</button>
            </div>
            <button id="btn-theme" class="iconbtn" title="Toggle light/dark theme">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M10.5 2.8a5.2 5.2 0 1 0 2.7 2.7A5.3 5.3 0 0 1 10.5 2.8z" />
              </svg>
            </button>
            <button id="btn-settings" class="iconbtn" title="Settings (⌘/Ctrl+,)">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <circle cx="8" cy="8" r="2.2" />
                <path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1" />
              </svg>
            </button>
          </div>
        </span>
      </div>

      <div id="main">
        <div id="editor-wrap">
          <div id="banner-slot"></div>
          <div id="editor-host"></div>
        </div>
        <div id="splitter" title="Drag to resize"></div>
        <div id="preview-host"></div>

        <div id="empty" class="hidden">
          <img data-logo data-logo-light="/logo-light.png" data-logo-dark="/logo-dark.png" src="/logo-light.png" alt="Xtracsys emblem" />
          <div class="empty-title">XTRACSYS EDITOR</div>
          <div class="empty-actions">
            <button id="empty-new" class="primary">New File</button>
            <button id="empty-open">Open…</button>
          </div>
          <div class="empty-hint">Plain-text editing that keeps your files byte-faithful — ⌘O to open anything, ⌘N for a new tab.</div>
        </div>
      </div>

      <div id="statusbar">
        <span class="sb-dot" title="Unsaved changes"></span>
        <span class="sb-item" id="status-path">No document</span>
        <span class="sb-item" id="status-encoding"></span>
        <span class="sb-item" id="status-eol"></span>
        <span class="sb-item" id="status-lang-name"></span>
        <span class="sb-spacer"></span>
        <span class="sb-item" id="status-pos"></span>
      </div>
    </div>
    <div id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
