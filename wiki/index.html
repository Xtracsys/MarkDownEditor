<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xtracsys Editor — Code Wiki</title>
<style>
:root{--bg:#fff;--surface:#f8f5eb;--text:#111;--muted:#5b5b57;--faint:#8a8a85;--line:rgba(17,17,17,.12);--line-2:rgba(17,17,17,.24);--red:#d92a2a;--on-accent:#fff;--wash:rgba(17,17,17,.05);--term-bg:#141414;--term-border:#2a2a2a;--term-head:#0e0e0e;--term-text:#f8f5eb;--term-shadow:rgba(17,17,17,.18);--maxw:1180px;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-family:var(--sans);color:var(--text);background:var(--bg);font-size:17px;line-height:1.6;color-scheme:light}
:root[data-theme="dark"]{--bg:#0a0a0a;--surface:#121212;--text:#f8f5eb;--muted:rgba(248,245,235,.56);--faint:rgba(248,245,235,.34);--line:rgba(248,245,235,.12);--line-2:rgba(248,245,235,.22);--red:#d92a2a;--on-accent:#0a0a0a;--wash:rgba(248,245,235,.06);--term-bg:#141414;--term-border:#2a2a2a;--term-head:#0e0e0e;--term-text:#f8f5eb;--term-shadow:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--maxw);margin:0 auto;padding:28px 20px 80px}

header.hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:24px 28px;box-shadow:0 1px 3px var(--term-shadow)}
.mark{width:64px;height:64px;border-radius:14px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain}
.mark-fallback{font-family:var(--mono);font-weight:800;font-size:20px;color:var(--text)}
.hero-text h1{font-size:20px;font-weight:700;letter-spacing:-.2px}
.hero-text p{color:var(--muted);font-size:14px;margin-top:2px}
.hero-meta{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.eyebrow{display:inline-flex;gap:9px;align-items:center;font-family:var(--mono);font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);
  background:var(--bg);padding:6px 12px}
.theme-toggle{appearance:none;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);background:var(--bg);border:1px solid var(--line);
  padding:6px 12px;cursor:pointer}
.theme-toggle:hover{color:var(--red);border-color:var(--red)}

nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-family:var(--sans);font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.tab:hover{color:var(--text);border-color:var(--line-2)}
.tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.tab .ic{font-size:13px;opacity:.85}

.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.panel{animation:none}}

section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:22px 24px;box-shadow:0 1px 3px var(--term-shadow);margin-bottom:18px}
section.card h2{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
section.card h2::before{content:"";width:4px;height:16px;background:var(--red);border-radius:2px;flex:0 0 auto}
section.card p{font-size:14.5px;color:var(--text);margin:0 0 .7em}
section.card p:last-child{margin-bottom:0}
a{color:var(--red)} a:hover{text-decoration:underline}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-weight:700;color:var(--muted);text-transform:uppercase;
  font-size:11px;letter-spacing:.5px;padding:8px 12px;border-bottom:2px solid var(--line-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--wash)}
code,td code{font-family:var(--mono);font-size:12.5px;background:var(--wash);padding:1px 5px;
  border-radius:5px;color:var(--red)}
td:first-child{font-family:var(--mono);font-size:12.5px}

pre.diagram{background:var(--term-bg);color:var(--term-text);border:1px solid var(--term-border);
  border-radius:12px;padding:20px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.45}

ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 18px 44px;border-left:2px solid var(--line);margin-left:14px}
ol.steps li:last-child{border-left-color:transparent;padding-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:-15px;top:-2px;width:28px;height:28px;
  background:var(--red);color:var(--on-accent);border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700}
ol.steps .st-title{font-weight:600;font-size:14.5px}
ol.steps .st-detail{font-size:13.5px;color:var(--muted);margin-top:3px}

footer{background:var(--term-head);border-top:3px solid var(--red);color:var(--term-text);
  padding:20px 0;font-size:12px}
footer .wrap{padding-top:0;padding-bottom:0}
.err{background:var(--wash);color:var(--red);padding:16px;border-radius:10px;font-size:14px}
.tab:focus-visible,.theme-toggle:focus-visible{outline:2px solid var(--red);outline-offset:3px}
</style>
</head>

     "type": "prose",
     "heading": "What it is",
     "body": "main.go is the thin Wails entry: it builds the App service, queues any documents passed on the command line, assembles the options (window, asset server with the /ximg/ handler, menu, drag-and-drop, single-instance lock, Mac options), and runs. Everything interesting lives in internal/app; this file only wires."

     "type": "prose",
     "heading": "External opens at the door",
     "body": "fileArgs(os.Args[1:]) extracts document paths (skipping '-'-prefixed flags so -psn_* launch noise never becomes a document) and queues them before wails.Run — the Windows/Linux 'Open With' path. macOS Finder opens arrive separately as Apple Events via mac.Options.OnFileOpen. Both flow into App.QueueExternalOpen, which queues until the UI signals readiness."
    },

     "type": "prose",
     "heading": "Single instance + drop",
     "body": "SingleInstanceLock (UniqueId editors.xtracsys.xtracsys-editor) forwards second-launch arguments to the first instance, resolving relative paths against the second instance's WorkingDirectory. DragAndDrop enables file drop with DisableWebViewDrop: true so the webview can never navigate to a dropped file. mac.OnFileOpen forwards Finder opens; mac.About carries the version."
    },

    {
     "type": "prose",
     "heading": "What it is",
     "body": "App is the single struct bound to the webview: every capability the UI has goes through its exported methods, and each one is a chokepoint that validates before touching disk. It owns the tab registry (path, encoding, known on-disk hash, dirty flag), the external-open queue, crash-recovery and session stores, settings, and the event emitter that routes Go→JS events through either Wails runtime.EventsEmit (desktop) or the headless sink (test bridge).\n\nThe struct was the source of the project's worst bug: moving it from package main to internal/app renamed the generated bindings from window.go.main.App to window.go.app.App, and the frontend's hard-coded namespace died. The frontend now resolves the bound service structurally (any package, struct exposing NewTab), so the namespace can never silently break again."
    },
    {
     "type": "prose",
     "heading": "External opens: queue then pull",
     "body": "QueueExternalOpen trims, drops flags and the executable's own path (EqualFold full-path compare), and either queues (extPending, before the UI is ready) or emits open:paths immediately. MarkExternalReady flips extReady atomically under extMu and RETURNS the backlog as its RPC result — delivery is pull-based, immune to event-listener wiring races. The unit test asserts exactly-once: the backlog arrives as the return value, never also as an event."
    },
    {
     "type": "prose",
     "heading": "SaveTab: the chokepoint",
     "body": "Validates tab existence, read-only state (in-place only — exports are allowed and clear the flag), non-empty path, and the encoding enum before any write. The known-state gate passes only for in-place saves; Save As onto another file is a deliberate policy (the native dialog confirms replace). After success it updates t.path/encoding/known, clears readOnly on export, and re-arms the watcher only if the tab still exists (a save completing after CloseTab is dropped)."
    },
    {
     "type": "prose",
     "heading": "Conversions and recovery",
     "body": "Convert to UTF-8 is frontend-driven (encodingDirty blocks autosave so the user's Save is the write). SnapshotTab validates the buffer with fileio.Rebuild before persisting and drops snapshots for tabs that no longer exist; RecoverEntry restores as a dirty tab with the on-disk known-state adopted so watcher and save-guard agree."
    },

     "body": "Every POST /api/ request passes guard(): Origin must be absent or exactly the app's own http://<addr> (browsers attach Origin to all same-origin POSTs — the earlier version wrongly rejected those), Host must equal the bound address (DNS-rebinding defense), Content-Type must be JSON (forces a CORS preflight for cross-site browsers). A live attack suite (scripts/security-dynamic.mjs) verifies all of it against the running server; guard_test.go covers the function. /api/events and /ximg/ are Host-pinned for parity."

    {
     "type": "prose",
     "heading": "What it is",
     "body": "eol.go is why mixed line endings survive editing. ParseEols splits text into lines plus a parallel terminator array (\"\\n\", \"\\r\\n\", \"\\r\", or \"\" for the final line) — the canonical representation every other function works from. ToLF produces the LF-normalized editor buffer; Rebuild joins them back, rejecting bare carriage returns and terminator-count mismatches rather than guessing."
    },
    {
     "type": "prose",
     "heading": "The phantom final line",
     "body": "ParseEols always appends a final line whose terminator is \"\" — a file 'a\\r\\nb\\r\\n' becomes lines [a, b, \"\"] with eols [CRLF, CRLF, \"\"]. This convention is the contract the frontend EOL tracker mirrors, and the source of one real bug: the first Normalize implementation filled the whole array with the target, giving the phantom line a terminator and appending a blank line on every save. The fix preserves the trailing \"\" — a file's own final-newline state is sacred.\n\nEolInfo returns the predominant terminator (used for newly typed lines) and a display summary (lf/crlf/cr/mixed/none). Ties break toward the terminator that appears earliest in the file, deterministically."
    },

       "Rebuild(content, eols)",
       "joins back; errors on bare CR, count mismatch, or invalid terminator — never guesses"

     "type": "prose",
     "heading": "What it is",
     "body": "WIKI.md is the historical encyclopedia of this thread: what was built in each release, what broke, how it was diagnosed, and what the project taught. It exists because several of the bugs here were unusual enough to be worth remembering — a bindings namespace that moved when a struct changed packages, a build pipeline silently shipping stale binaries because a codesign step aborted, an iCloud file provider that renamed README.md and corrupted build outputs.\n\nEach release section follows the same shape: what shipped, what the war story was, and how it was verified. The 'war stories' section distills the transferable lessons: error visibility is a feature (silent fallbacks masked dead bindings for three releases), static audits find design flaws while dynamic tests find wiring bugs, and nil slices crossing Go→JSON→TS crash on .length."
    },
    {
     "type": "prose",
     "heading": "Release highlights",
     "body": "0.1.0 — working editor: Go file-integrity engine, Wails app, frontend, e2e bridge. First acceptance run caught a re-entrant-save bug in the external-change flow.\n\n0.1.1 — 'Open With' (macOS Apple Events were never wired), crash recovery, first static security audit.\n\n0.1.2 — the bindings catastrophe: App moved from package main to internal/app, silently renaming window.go.main.App to window.go.app.App; a strict CSP meta broke the injected runtime; a nil-slice crashed startup. Fixed plus the error-visibility work that made it diagnosable.\n\n0.1.3 — icon fix (iconfile.icns name mismatch) + three-audit bug hunt (packaging, frontend QA, regression review).\n\n0.1.4 — stale-artifact pipeline fix: build stamp verification after the installed app was found running old code; iCloud detritus countermeasures.\n\n0.1.5 — dynamic security testing (fuzzers, XSS battery, HTTP attack suite) + the approved roadmap features: session restore (with setting), Open Recent, convert commands, outline, image paste, reveal, print.\n\n0.1.6 — round-5/6 fix-verification: the host-pinning wiring caught unwired and fixed with live route tests; the Restore-session settings row (a silent str.replace no-op had faked it); Settings modal inert trap; session-store atomicity; a committed test binary removed. The wiki you are reading is part of the release."

     "body": "The security record spans four audit rounds plus a dynamic-testing program. The model is defense in depth around untrusted content: the Markdown preview is a sandboxed iframe (allow-same-origin, NO allow-scripts) with CSP default-src 'none', fed by marked → DOMPurify → URL rewriting; local images are served only from the open document's directory tree through a sniffed, size-capped, SVG-excluding handler; the only outbound network action in the shipped app is a user-clicked http(s) link validated in Go.\n\nSECURITY.md is the disclosure policy: scope (fileio, preview sandbox, image handler, settings, dependency vulnerabilities), out-of-scope (the webview engines themselves), design guarantees researchers should test, and the crash-recovery data disclosure (0600 snapshots in app-data only)."

     "heading": "Round-by-round",
     "body": "Round 1 (static, at 0.1.1): preview sandbox verified; image-handler containment hardened; e2e bridge origin/Host/Content-Type guard added after the drive-by-write finding; Go toolchain pinned to 1.26.10 for nine reachable stdlib CVEs.\n\nRound 2 (frontend): sanitizer configuration, srcdoc/CSP construction, DOM hygiene (textContent everywhere) verified; four low fixes applied.\n\nRound 3 (dynamic, at 0.1.5): Go fuzzers (60M+ execs), a 26-vector live XSS battery, and a 19-check HTTP attack suite. The dynamic suite caught two real regressions: the bridge guard dropped from the handler, and the same guard over-rejecting same-origin POSTs (browsers attach Origin to all non-GET requests).\n\nRound 4 (0.1.5 features): WriteImageFile containment provable (charset-restricted names, fixed extension, O_EXCL), menu action round-trip injection-proof; fixes for the normalize trailing-terminator bug and RevealPath flag-like paths."

<script>
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const RICH = /(https?:\/\/[^\s<>()"]+[^\s<>().,;:"]|`[^`]+`|(?:[A-Za-z0-9_.\-]+\/)*[A-Za-z0-9_.\-]+\.(?:py|go|js|ts|tsx|jsx|md|json|html|css|sh|gd|tscn|toml|ya?ml|cfg|txt|rs|java|c|cpp|h|rb|php)(?![A-Za-z0-9_.\-]))/g;
function rich(s){
  return esc(s).replace(RICH, m => {
    if (m.startsWith('http')) return '<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>';
    if (m.startsWith('`')) return '<code>'+m.slice(1,-1)+'</code>';
    return '<code>'+m+'</code>';
  });
}

function renderSection(sec){
  let h = '<section class="card">';
  if (sec.heading) h += `<h2>${esc(sec.heading)}</h2>`;
  if (sec.type === 'prose'){
    h += String(sec.body ?? '').split(/\n\n+/).map(p => `<p>${rich(p)}</p>`).join('');
  } else if (sec.type === 'diagram'){
    h += `<pre class="diagram">${esc(sec.body)}</pre>`;
  } else if (sec.type === 'table'){
    h += '<table><thead><tr>' + (sec.columns||[]).map(c=>`<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>';
    h += (sec.rows||[]).map(r=>'<tr>'+r.map(cell=>`<td>${rich(cell)}</td>`).join('')+'</tr>').join('');
    h += '</tbody></table>';
  } else if (sec.type === 'steps'){
    h += '<ol class="steps">' + (sec.items||[]).map(it=>
      `<li><div class="st-title">${rich(it.title)}</div><div class="st-detail">${rich(it.detail)}</div></li>`).join('') + '</ol>';
  }
  return h + '</section>';
}

function applyTheme(theme){
  const root = document.documentElement;
  root.dataset.theme = theme;
  document.body.style.backgroundColor = theme==='dark' ? '#0a0a0a' : '#fff';
}

function build(data){
  const meta = data.meta || {};
  document.getElementById('m-title').textContent = meta.title || 'Code Wiki';
  document.getElementById('m-sub').textContent = meta.subtitle || '';
  document.getElementById('m-ver').textContent = 'v' + (meta.version || '');
  document.getElementById('m-date').textContent = meta.date || '';
  document.title = meta.title || 'Code Wiki';
  const logo = meta.logo || '';
  document.getElementById('mark').innerHTML = logo
    ? `<img src="${logo}" alt="logo">` : '<span class="mark-fallback">X</span>';
  const sources = (meta.sources || []);
  const srcLine = sources.length > 8
    ? sources.slice(0,8).join('  •  ') + `  •  +${sources.length-8} more`
    : sources.join('  •  ');
  document.getElementById('foot').textContent =
    (srcLine ? 'Sources: ' + srcLine + '  —  ' : '') + (meta.date || '') +
    `  ·  Edit ${meta.data_file || 'wiki_data.json'} then run wikiupdate.py`;

  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('content');
  tabsEl.innerHTML = '';
  contentEl.innerHTML = '';
  const storeKey = 'wiki-tab:' + (meta.title || 'default');
  const saved = localStorage.getItem(storeKey);

  (data.tabs || []).forEach((tab)=>{
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.type = 'button';
    btn.innerHTML = `<span class="ic">${esc(tab.icon||'')}</span>${esc(tab.label)}`;
    btn.dataset.id = tab.id;
    tabsEl.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = 'panel-' + tab.id;
    panel.innerHTML = (tab.sections || []).map(renderSection).join('');
    contentEl.appendChild(panel);

    btn.addEventListener('click', ()=>activate(tab.id));
  });

  if (!(data.tabs || []).length){
    contentEl.innerHTML = `<div class="err">No tabs in ${meta.data_file || 'wiki_data.json'}</div>`;
    return;
  }
  const start = (saved && data.tabs.some(t=>t.id===saved)) ? saved : data.tabs[0].id;
  activate(start);
}

function activate(id){
  document.querySelectorAll('.tab').forEach(b=>{
    const on = b.dataset.id===id;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', String(on));
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
  const meta = (window.__WIKI_META__ || {});
  localStorage.setItem('wiki-tab:' + (meta.title || 'default'), id);
}

(function(){
  const savedTheme = localStorage.getItem('wiki-theme');
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  const toggle = document.getElementById('theme-toggle');
  toggle.addEventListener('click', ()=>{
    const next = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
    localStorage.setItem('wiki-theme', next);
    applyTheme(next);
  });
  let data = null;
  try{
    const node = document.getElementById('wiki-data');
    if (node && node.textContent.trim()){
      const parsed = JSON.parse(node.textContent.replace(/<\\\//g, '</'));
      if (parsed.tabs && parsed.tabs.length) data = parsed;
    }
  }catch(e){ /* fall through to fetch */ }
  if (data){ window.__WIKI_META__ = data.meta; build(data); return; }
  fetch("wiki_data.json")
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(d=>{ window.__WIKI_META__ = d.meta; build(d); })
    .catch(e=>{
      document.getElementById('content').innerHTML =
        `<div class="err"><strong>Could not load data.</strong><br>${esc(e.message)}</div>`;
    });
})();
</script>
</body>
</html>
