#
# Build + test on all three desktop platforms. Go tests, frontend unit tests,
# and the Playwright acceptance suite (against the real Go backend through the
# loopback bridge) run everywhere; packaging runs per-OS.

name: build-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux webview prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Go tests (file-integrity core + settings + image sandbox)
        run: go vet ./... && go test ./... -race -count=1

      - name: Frontend install + typecheck + unit tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

      - name: Build frontend bundle (for E2E and packaging)
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Acceptance E2E (real UI against real backend)
        run: npx playwright test

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: xtracsys-editor.app
          - os: windows-latest
            platform: windows/amd64
            artifact: xtracsys-editor.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: xtracsys-editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build application
        run: ~/go/bin/wails build -platform ${{ matrix.platform }}

      - name: Package installers (macOS DMG)
        if: runner.os == 'macOS'
        run: |
          xattr -cr build/bin || true
          codesign --force --sign - build/bin/xtracsys-editor.app || true
          scripts/make-dmg.sh build/bin/xtracsys-editor.app build/bin/xtracsys-editor-macos-universal.dmg

      - name: Package installers (Windows NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y nsis
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          ~/go/bin/wails build -platform windows/amd64 -f nsis
          Compress-Archive -Path build/bin/xtracsys-editor.exe -DestinationPath build/bin/xtracsys-editor-windows-x64.zip

      - name: Package installers (Linux tar + deb)
        if: runner.os == 'Linux'
        run: |
          cd build/bin && tar czf xtracsys-editor-linux-x64.tar.gz xtracsys-editor && cd ../..
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/applications pkg/usr/share/icons/hicolor/512x512/apps
          cp build/bin/xtracsys-editor pkg/usr/bin/
          cp build/linux/512x512.png pkg/usr/share/icons/hicolor/512x512/apps/xtracsys-editor.png
          printf 'Package: xtracsys-editor\nVersion: 0.1.0\nSection: editors\nPriority: optional\nArchitecture: amd64\nMaintainer: Xtracsys <dev@xtracsys.invalid>\nDescription: Local-first text and Markdown editor\nDepends: libwebkit2gtk-4.1-0, libgtk-3-0\n' > pkg/DEBIAN/control
          printf '[Desktop Entry]\nType=Application\nName=Xtracsys Editor\nExec=xtracsys-editor\nIcon=xtracsys-editor\nCategories=Development;TextEditor;\n' > pkg/usr/share/applications/xtracsys-editor.desktop
          dpkg-deb --build pkg build/bin/xtracsys-editor_0.1.0_amd64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtracsys-editor-${{ matrix.os }}
          path: build/bin/*
          if-no-files-found: error

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          ~/go/bin/govulncheck ./...
      - name: npm audit (production tree)
        working-directory: frontend
        run: npm audit --omit=dev

  # Releases are intentional, manual acts — never automatic on push.
  # Publishing requires explicit approval per project policy.
