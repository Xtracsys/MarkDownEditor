#
# Build + test on all three desktop platforms. Go tests, frontend unit tests,
# and the Playwright acceptance suite (against the real Go backend through the
# loopback bridge) run everywhere; packaging runs per-OS.

name: build-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux webview prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Go tests (file-integrity core + settings + image sandbox)
        run: go vet ./... && go test ./... -race -count=1

      - name: Frontend install + typecheck + unit tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

      - name: Build frontend bundle (for E2E and packaging)
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Acceptance E2E (real UI against real backend)
        run: npx playwright test

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: xtracsys-editor.app
          - os: windows-latest
            platform: windows/amd64
            artifact: xtracsys-editor.exe
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: xtracsys-editor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build application
        run: ~/go/bin/wails build -platform ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtracsys-editor-${{ matrix.os }}
          path: build/bin/*
          if-no-files-found: error

  # Releases are intentional, manual acts — never automatic on push.
  # Publishing requires explicit approval per project policy.
